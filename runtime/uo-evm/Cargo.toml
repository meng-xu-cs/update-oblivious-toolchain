[package]
name = "uo-evm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# A diagnostics build returns a call's private evidence with its receipt and
# can write it out for the Lean checkers. The production policy rejects it.
diagnostics = ["uo-core/diagnostics"]
insecure-eval-raw = []

[dependencies]
anyhow.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
hex.workspace = true
hkdf.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiny-keccak.workspace = true
uo-core = { path = "../../crates/uo-core" }
uo-allocator = { path = "../uo-allocator" }
uo-kernel-runtime = { path = "../uo-kernel-runtime" }
uo-precompiles = { path = "../uo-precompiles" }
uo-store = { path = "../uo-store" }
zeroize.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
# The unit tests read a call's whole trace and write it out.
uo-core = { path = "../../crates/uo-core", features = ["diagnostics"] }
uo-solc = { path = "../../compiler/uo-solc" }
