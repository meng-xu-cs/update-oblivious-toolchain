[package]
name = "uo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lets a call's private evidence, and so its whole trace, be serialized and
# printed. The Lean checkers read those forms. A production runtime is built
# without it.
diagnostics = []

[dependencies]
anyhow.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
uo-precompiles = { path = "../../runtime/uo-precompiles" }

[build-dependencies]
hex.workspace = true
sha2.workspace = true
