name: ci

# Focused baseline runs on every push / PR. Full validation is available as a
# manual (workflow_dispatch) or scheduled (nightly) job because it regenerates
# the complete results/ bundle and is expensive.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup honors rust-toolchain.toml, installing the pinned channel.
      - run: rustup show
      - run: cargo fmt --all --check
      - name: No machine-specific absolute paths in tracked files
        run: scripts/check_portable_paths.sh

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p mplus-probe
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      # A workspace build turns on uo-evm's diagnostics feature (mplus-probe
      # depends on it). The production policy rejects that feature, so the
      # tests of the production call path are compiled out of the two runs
      # above. This runs them, in the build a production runtime uses.
      - run: cargo test -p uo-evm

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  lean-proof-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (pinned Lean toolchain)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/v3.1.1/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat proof/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build proof-grade root
        working-directory: proof/lean
        run: lake build UOToolchain.ProofGradeRoot

  probe-validation:
    # Focused probe validation gate: fast, runs on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The static-checks report builds and runs the Lean proof-grade checker
      # executables, so this job needs the pinned Lean toolchain as well.
      - name: Install elan (pinned Lean toolchain)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/v3.1.1/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat proof/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: static checks probe report
        run: cargo run -q -p mplus-probe -- --only static-checks --out-dir results
      - name: Lean assumption and axiom budget
        run: scripts/lean_assumption_budget.sh
      - name: differential correctness (fast subset)
        run: UO_CORRECTNESS_TRIALS=4 cargo run -q -p mplus-probe --features insecure-eval-raw -- --only correctness --out-dir results
      - name: abort/rollback edge-case study
        run: cargo run -q -p mplus-probe -- --only abort-rollback --out-dir results
      - name: AVL map replay against the Lean model
        run: cargo run -q -p mplus-probe -- --only path-oram-avl-map-replay --out-dir results
      - name: tape substitution (runs on other seeds against the substituted run)
        run: cargo run -q -p mplus-probe -- --only tape-substitution --out-dir results
      - name: storage boundary (store log against traces, restart from files)
        run: cargo run -q -p mplus-probe -- --only storage-boundary --out-dir results
      - name: fail-closed acceptance aggregate
        run: cargo run -q -p mplus-probe -- --only acceptance-check --out-dir results
      - name: Path ORAM claim-consistency
        run: cargo run -q -p mplus-probe -- --only claim-consistency --out-dir results
      - name: Claim artifact manifest coverage
        run: cargo run -q -p mplus-probe -- --only claim-status --out-dir results
      # The steps above regenerate their reports into results/. They are
      # deterministic and checkout-independent, so any difference means the
      # committed results are stale (regenerate with scripts/run_validation.sh)
      # or a report started depending on the build machine.
      - name: Regenerated reports match the committed results
        run: |
          if ! git diff --quiet -- results; then
            git diff --stat -- results
            git diff -- results | head -200
            exit 1
          fi

  full-validation:
    # Heavy end-to-end validation. Manual or nightly only.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The validation builds the workspace in several profiles and feature
      # sets, and the Lean checkers; with the runner's preinstalled SDKs the
      # disk ran out before it finished (2026-11-15). None of them is used.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install elan (pinned Lean toolchain)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/v3.1.1/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat proof/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: full baseline gate
        run: scripts/baseline.sh --full
      - name: upload results bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-bundle
          path: results/
