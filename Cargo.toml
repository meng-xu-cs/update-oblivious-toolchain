[workspace]
members = [
    "crates/uo-core",
    "runtime/uo-store",
    "runtime/uo-allocator",
    "runtime/uo-precompiles",
    "runtime/uo-evm",
    "compiler/uo-solc",
    "checker/uo-check",
    "probe/mplus-probe",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.95"
bincode = { version = "=2.0.1", features = ["serde"] }
clap = { version = "=4.5.30", features = ["derive"] }
hex = "=0.4.3"
itertools = "=0.14.0"
once_cell = "=1.20.3"
rand = { version = "=0.8.5", features = ["std_rng"] }
rand_chacha = "=0.3.1"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
serde_yaml = "=0.9.34"
solang-parser = "=0.3.3"
thiserror = "=1.0.69"
