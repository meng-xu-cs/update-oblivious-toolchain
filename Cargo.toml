[workspace]
members = [
    "crates/uo-core",
    "runtime/uo-store",
    "runtime/uo-allocator",
    "runtime/uo-precompiles",
    "runtime/uo-evm",
    "compiler/uo-solc",
    "checker/uo-check",
    "probe/mplus-probe",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.95"
bincode = { version = "=2.0.1", features = ["serde"] }
chacha20poly1305 = "=0.10.1"
clap = { version = "=4.5.30", features = ["derive"] }
hex = "=0.4.3"
itertools = "=0.14.0"
once_cell = "=1.20.3"
rand = { version = "=0.8.5", features = ["std_rng"] }
rand_chacha = "=0.3.1"
rayon = "=1.10.0"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = { version = "=1.0.138", features = ["arbitrary_precision"] }
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
solang-parser = "=0.3.3"
thiserror = "=1.0.69"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
zeroize = "=1.8.2"
