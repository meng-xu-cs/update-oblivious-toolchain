contract: RegistryCRUD
entrypoints:
  upsert(bytes32,uint256):
    secret_args: [key, value]
    confidential: true
    public_gas_budget: 12288
    returns: forbidden
    status: public
  clear(bytes32):
    secret_args: [key]
    confidential: true
    public_gas_budget: 12288
    returns: forbidden
    status: public
  clearIfMatch(bytes32,uint256):
    secret_args: [key, value]
    confidential: true
    public_gas_budget: 12288
    returns: declassified
    status: public
    declassifies: [return]
  read(bytes32):
    confidential: false
    returns: declassified
    status: public
    declassifies: [return]
state:
  records:
    kind: map
    key: bytes32
    value: uint256
    capacity: 8
    backend: full_scan
    confidential: true
bounds:
  loops: {}
