contract: FactReuseMap
# The map on the local scheme. The runtime's tests and the tamper suite
# compile it; it is not one of the benchmarks.
entrypoints:
  put(bytes32,uint256):
    secret_args: [key, value]
    confidential: true
    returns: forbidden
    status: declassified
    declassifies: [success]
  swap(bytes32,bytes32):
    secret_args: [a, b]
    confidential: true
    returns: forbidden
    status: declassified
    declassifies: [success]
  take(bytes32,uint256):
    secret_args: [key, amount]
    confidential: true
    returns: forbidden
    status: declassified
    declassifies: [success]
  read(bytes32):
    secret_args: [key]
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
state:
  records:
    kind: map
    key: bytes32
    value: uint256
    capacity: 16
    backend: oram
    oram_scheme: path_oram_local_posmap_v1
    confidential: true
bounds:
  loops: {}
