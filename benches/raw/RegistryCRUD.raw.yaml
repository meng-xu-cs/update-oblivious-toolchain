contract: RegistryCRUD
entrypoints:
  upsert(bytes32,uint256):
    secret_args: [key, value]
    confidential: true
    returns: forbidden
    status: declassified
    declassifies: [success]
  clear(bytes32):
    secret_args: [key]
    confidential: true
    returns: forbidden
    status: declassified
    declassifies: [success]
  clearIfMatch(bytes32,uint256):
    secret_args: [key, value]
    confidential: true
    returns: declassified
    status: declassified
    declassifies: [return, success]
  read(bytes32):
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
state:
  records:
    kind: map
    key: bytes32
    value: uint256
    capacity: 8
    backend: raw
    confidential: true
bounds:
  loops: {}
