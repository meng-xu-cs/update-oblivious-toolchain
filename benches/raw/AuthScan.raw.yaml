contract: AuthScan
entrypoints:
  seed(uint256,bytes32):
    confidential: false
    returns: forbidden
    status: public
  auth(bytes32):
    secret_args: [token]
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
  readLast():
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
state:
  TOKENS:
    kind: array
    value: bytes32
    capacity: 4
    backend: raw
    confidential: true
  lastAuth:
    kind: cell
    value: uint256
    backend: raw
    confidential: true
bounds:
  loops: {}
