contract: ERC20Lite
entrypoints:
  mint(address,uint256):
    confidential: false
  approve(address,address,uint256):
    secret_args: [owner, spender, amount]
    confidential: true
    public_gas_budget: 20480
  transfer(address,address,uint256):
    secret_args: [from, to, amount]
    confidential: true
    public_gas_budget: 20480
  transferFrom(address,address,address,uint256):
    secret_args: [owner, spender, to, amount]
    confidential: true
    public_gas_budget: 24576
  balanceOf(address):
    confidential: false
  allowanceOf(address,address):
    confidential: false
state:
  balances:
    kind: map
    key: address
    value: uint256
    capacity: 8
    backend: full_scan
    confidential: true
  allowances:
    kind: map
    key: bytes32
    value: uint256
    capacity: 16
    backend: full_scan
    confidential: true
bounds:
  loops: {}
