contract: ConfidentialMixer
entrypoints:
  deposit(bytes32,uint256):
    secret_args: [commitment, amount]
    confidential: true
    public_gas_budget: 16384
    returns: forbidden
    status: public
  withdraw(bytes32,uint256):
    secret_args: [commitment, amount]
    confidential: true
    public_gas_budget: 16384
    returns: declassified
    status: declassified
    declassifies: [return, success]
  balanceOf(bytes32):
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
  totalValue():
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
state:
  balances:
    kind: map
    key: bytes32
    value: uint256
    capacity: 8
    backend: full_scan
    confidential: true
  total:
    kind: cell
    value: uint256
    backend: full_scan
    confidential: true
bounds:
  loops: {}
