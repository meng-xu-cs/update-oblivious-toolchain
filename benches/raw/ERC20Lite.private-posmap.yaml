contract: ERC20Lite
# Puts the multi-access balances map on the scalable private-position-map route
# above the local scheme's cap (capacity 256); allowances stay on the local
# route. transfer and transferFrom make four accesses to balances per call. The
# probe runs it as the oram_private_posmap variant of ERC20Lite.
entrypoints:
  mint(address,uint256):
    confidential: true
    returns: forbidden
    status: declassified
    declassifies: [success]
  approve(address,address,uint256):
    secret_args: [owner, spender, amount]
    confidential: true
    returns: forbidden
    status: declassified
    declassifies: [success]
  transfer(address,address,uint256):
    secret_args: [from, to, amount]
    confidential: true
    returns: declassified
    status: declassified
    declassifies: [return, success]
  transferFrom(address,address,address,uint256):
    secret_args: [owner, spender, to, amount]
    confidential: true
    returns: declassified
    status: declassified
    declassifies: [return, success]
  balanceOf(address):
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
  allowanceOf(address,address):
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
state:
  balances:
    kind: map
    key: address
    value: uint256
    capacity: 256
    backend: oram
    oram_scheme: path_oram_private_posmap_v1
    confidential: true
  allowances:
    kind: map
    key: bytes32
    value: uint256
    capacity: 128
    backend: oram
    oram_scheme: path_oram_local_posmap_v1
    confidential: true
bounds:
  loops: {}
