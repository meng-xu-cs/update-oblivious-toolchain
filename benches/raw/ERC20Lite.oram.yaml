contract: ERC20Lite
entrypoints:
  mint(address,uint256):
    confidential: true
    returns: forbidden
    status: public
  approve(address,address,uint256):
    secret_args: [owner, spender, amount]
    confidential: true
    returns: forbidden
    status: public
  transfer(address,address,uint256):
    secret_args: [from, to, amount]
    confidential: true
    returns: declassified
    status: declassified
    declassifies: [return, success]
  transferFrom(address,address,address,uint256):
    secret_args: [owner, spender, to, amount]
    confidential: true
    returns: declassified
    status: declassified
    declassifies: [return, success]
  balanceOf(address):
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
  allowanceOf(address,address):
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
state:
  balances:
    kind: map
    key: address
    value: uint256
    capacity: 64
    backend: oram
    oram_scheme: path_oram_local_posmap_v1
    confidential: true
  allowances:
    kind: map
    key: bytes32
    value: uint256
    capacity: 128
    backend: oram
    oram_scheme: path_oram_local_posmap_v1
    confidential: true
bounds:
  loops: {}
