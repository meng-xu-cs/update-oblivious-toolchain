contract: ConfidentialMixer
entrypoints:
  deposit(bytes32,uint256):
    secret_args: [commitment, amount]
    confidential: true
    returns: forbidden
    status: declassified
    declassifies: [success]
  withdraw(bytes32,uint256):
    secret_args: [commitment, amount]
    confidential: true
    returns: declassified
    status: declassified
    declassifies: [return, success]
  balanceOf(bytes32):
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
  sealedBalanceOf(bytes32):
    secret_args: [commitment]
    confidential: true
    returns: encrypted_to_client
    status: public
  totalValue():
    confidential: true
    returns: declassified
    status: public
    declassifies: [return]
state:
  balances:
    kind: map
    key: bytes32
    value: uint256
    capacity: 64
    backend: oram
    oram_scheme: path_oram_local_posmap_v1
    confidential: true
  total:
    kind: cell
    value: uint256
    backend: full_scan
    confidential: true
bounds:
  loops: {}
